nodes:
  - id: energy-wizards
    title: Energy Wizards
    description: >
      Power grid data and consumption records of the MICE campus.
      Returns aggregates and trends only; raw consumption values are
      blocked by policy.
    endpoint: http://localhost:8001
    policy_mode: deny

  - id: commons-scholars
    title: Commons Scholars
    description: >
      Public research papers, datasets, and publication statistics of
      MICE. Open data; answers carry an attribution obligation.
    endpoint: http://localhost:8002
    policy_mode: oblige

  - id: archivists
    title: Archivists
    description: >
      Historical records, staffing history, and institutional events of
      MICE. Personal names and dates of birth are redacted by policy.
    endpoint: http://localhost:8003
    policy_mode: redact

  - id: estates-keepers
    title: Estates & Facilities
    description: >
      Buildings, floorspace, and building-meter energy readings of MICE.
      Holds an independent metered estimate of campus energy consumption
      (overlaps the Energy Wizards' grid figures) plus lab-expansion
      history. Open data; attribution required.
    endpoint: http://localhost:8004
    policy_mode: oblige

  - id: bursar-office
    title: Office of the Bursar
    description: >
      Budgets, payroll, and expenditure of MICE. Holds funded
      research-staff headcounts (overlaps the Archivists' staffing
      history) and an energy-spend-based estimate of campus consumption
      (overlaps the Energy Wizards' figures). Open data; attribution
      required.
    endpoint: http://localhost:8005
    policy_mode: oblige
