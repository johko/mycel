# Display-only branding for the web UI (the core framework ships none).
title: 🧙 MICE — Magical Institute for Commons and Energy
tagline: >
  A <b>Federated Multi-Agent System</b> — every answer leaves its department
  only through the Jealous Wizard's policy.
examples:
  - "What was total campus energy consumption over 2020–2024, in kWh?"
  - "How many research staff did MICE have on average in 2020–2024?"
  - "What exactly was Tower A's energy consumption in 2024, in kWh?"
  - "Who is the head of the Alchemy Lab and when were they born?"
  - "What is the relationship between energy consumption patterns and research output at MICE over the last decade?"

nodes:
  - id: energy-wizards
    title: Energy Wizards
    icon: "⚡"
    description: >
      Power grid data and consumption records of the MICE campus.
      Returns aggregates and trends only; raw consumption values are
      blocked by policy.
    endpoint: http://localhost:8001
    policy_mode: deny
    tags: [energy-consumption, power-grid, kWh, peak-load, campus-aggregate, consumption-trends, towers]

  - id: commons-scholars
    title: Commons Scholars
    icon: "📜"
    description: >
      Public research papers, datasets, and publication statistics of
      MICE. Open data; answers carry an attribution obligation.
    endpoint: http://localhost:8002
    policy_mode: oblige
    tags: [research-output, publications, papers, datasets, citations, publication-statistics]

  - id: archivists
    title: Archivists
    icon: "🗄️"
    description: >
      Historical records, staffing history, and institutional events of
      MICE. Personal names and dates of birth are redacted by policy.
    endpoint: http://localhost:8003
    policy_mode: redact
    tags: [staffing, research-staff, personnel, institutional-events, lab-expansion, institute-history]

  - id: estates-keepers
    title: Estates & Facilities
    icon: "🏛️"
    description: >
      Buildings, floorspace, and building-meter energy readings of MICE.
      Holds an independent metered estimate of campus energy consumption
      (overlaps the Energy Wizards' grid figures) plus lab-expansion
      history. Open data; attribution required.
    endpoint: http://localhost:8004
    policy_mode: oblige
    tags: [energy-consumption, building-meters, floorspace, buildings, lab-expansion, facilities]

  - id: bursar-office
    title: Office of the Bursar
    icon: "💰"
    description: >
      Budgets, payroll, and expenditure of MICE. Holds funded
      research-staff headcounts (overlaps the Archivists' staffing
      history) and an energy-spend-based estimate of campus consumption
      (overlaps the Energy Wizards' figures). Open data; attribution
      required.
    endpoint: http://localhost:8005
    policy_mode: oblige
    tags: [energy-consumption, research-staff, budget, payroll, expenditure, energy-spend, funded-programs]
