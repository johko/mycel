name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Cache the RAG connector's embedding model so it isn't re-downloaded.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      # --extra demo pulls qdrant+fastembed so the SQL/RAG connector tests run
      # (without it those tests skip).
      - name: Install
        run: uv sync --extra demo
      - name: Run tests
        run: uv run pytest -q
