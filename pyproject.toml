[project]
name = "mycel"
dynamic = ["version"]
description = "Mycel: a federated multi-agent system framework with policy-governed data egress"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["multi-agent", "federated", "mcp", "llm", "agents", "opa", "data-governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "huggingface_hub>=0.30",
    "mcp>=1.0",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
]


[project.optional-dependencies]
# The reference RAG connector backend. SQLite is stdlib, so only Qdrant +
# fastembed (CPU/ONNX embeddings) are extra. Pulled by the demo image.
demo = ["qdrant-client[fastembed]>=1.7"]

[project.scripts]
diplomat = "mycel.node.main:run"
connector = "mycel.demo.connector.main:run"
mycel-ask = "mycel.orchestrator.cli:main"
mycel-ui = "mycel.orchestrator.web:run"
mycel-demo = "mycel.demo.cli:main"

[tool.setuptools.package-data]
mycel = ["orchestrator/static/*"]
"mycel.demo" = ["assets/**/*", "assets/.env.example"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# Version is derived from the git tag (e.g. tag v0.2.0 -> 0.2.0). Never edit a
# version by hand — cut a release by tagging. See .github/workflows/release.yml.
[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[project.authors]]
name = "Johannes Kolbe"
email = "johko@posteo.de"

[project.urls]
Homepage = "https://github.com/johko/mycel"
Repository = "https://github.com/johko/mycel"
Issues = "https://github.com/johko/mycel/issues"
