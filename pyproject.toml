[project]
name = "mycel"
version = "0.1.0"
description = "Mycel: A federated multi-agent system framework. Development in progress"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "huggingface_hub>=0.30",
    "mcp>=1.0",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# The demo's *content* (data, node configs, OPA policies, docker-compose stack)
# ships inside the package as `mycel.demo`. Under the current split the demo
# needs no Python deps beyond core, so this extra is the documented install
# surface for it (`pip install mycel[demo]`) and the home for any future
# demo-only dependency. Core (`pip install mycel`) is the framework alone.
demo = []

[project.scripts]
diplomat = "mycel.node.main:run"
connector = "mycel.connector.main:run"
mycel-ask = "mycel.orchestrator.cli:main"
mycel-ui = "mycel.orchestrator.web:run"
mycel-demo = "mycel.demo.cli:main"

[tool.setuptools.package-data]
mycel = ["orchestrator/static/*"]
"mycel.demo" = ["assets/**/*", "assets/.env.example"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[project.authors]]
name = "Johannes Kolbe"
email = "johko@posteo.de"
